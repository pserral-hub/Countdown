<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="countdown">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230d0d0f'/%3E%3Ctext x='90' y='118' font-family='system-ui,sans-serif' font-size='80' font-weight='300' fill='%23e87c7c' text-anchor='middle'%3Ec%3C/text%3E%3C/svg%3E">
<link rel="manifest" href='data:application/manifest+json,{"name":"countdown","short_name":"countdown","start_url":".","display":"standalone","background_color":"#0d0d0f","theme_color":"#0d0d0f"}'>
<title>countdown</title>
<style>
:root{
  --bg:#0d0d0f;--surface:#16161a;--surface-2:#1c1c22;
  --border:#2a2a32;--text:#e4e4e7;--text2:#a1a1aa;--text3:#71717a;
  --accent:#e87c7c;--green:#4ade80;--danger:#f87171;
  --radius:10px;--ease:cubic-bezier(.4,0,.2,1);
}
@media(prefers-color-scheme:light){
  :root{
    --bg:#fafafa;--surface:#fff;--surface-2:#f4f4f5;
    --border:#e4e4e7;--text:#18181b;--text2:#52525b;--text3:#a1a1aa;
    --accent:#c24444;--green:#16a34a;--danger:#dc2626;
  }
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100dvh;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
.wrap{
  max-width:520px;margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 32px) 20px calc(env(safe-area-inset-bottom) + 32px);
}
.hidden{display:none}

/* auth */
.auth{text-align:center;padding-top:20vh}
.auth .logo{font-size:13px;font-weight:500;letter-spacing:.08em;color:var(--text3);text-transform:uppercase;margin-bottom:32px}
.auth h1{font-size:22px;font-weight:600;margin-bottom:6px;letter-spacing:-.01em}
.auth .sub{color:var(--text3);font-size:14px;margin-bottom:32px}
.auth form{text-align:left}
.auth input{
  width:100%;padding:12px 14px;margin-bottom:10px;
  border:1px solid var(--border);border-radius:var(--radius);
  font-size:15px;background:var(--surface);color:var(--text);outline:none;
  transition:border-color .2s;
}
.auth input:focus{border-color:var(--accent)}
.auth input::placeholder{color:var(--text3)}
.auth button{
  width:100%;padding:12px;margin-top:4px;
  border:none;border-radius:var(--radius);
  background:var(--accent);color:var(--bg);
  font-size:15px;font-weight:600;cursor:pointer;
  transition:opacity .15s;
}
.auth button:active{opacity:.8}
.auth .swap{margin-top:20px;font-size:13px;color:var(--text3)}
.auth .swap a{color:var(--accent);cursor:pointer;text-decoration:none;font-weight:500}
.err{color:var(--danger);font-size:13px;margin-bottom:10px;min-height:18px}

/* header */
.hdr{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:24px}
.hdr h1{font-size:20px;font-weight:700;letter-spacing:-.02em}
.hdr .right{display:flex;align-items:center;gap:10px}
.hdr .date{font-size:12px;color:var(--text3)}
.hdr .out{
  font-size:12px;color:var(--text3);background:none;
  border:1px solid var(--border);padding:4px 10px;
  border-radius:6px;cursor:pointer;transition:color .15s,border-color .15s;
}
.hdr .out:hover{color:var(--text2);border-color:var(--text3)}

/* add */
.add-box{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px;margin-bottom:20px;
}
.add-box input[type=text]{
  width:100%;padding:11px 14px;margin-bottom:10px;
  border:1px solid var(--border);border-radius:8px;
  font-size:14px;background:var(--bg);color:var(--text);outline:none;
}
.add-box input[type=text]:focus{border-color:var(--accent)}
.add-box input[type=text]::placeholder{color:var(--text3)}
.add-box .row{display:flex;gap:8px}
.add-box input[type=datetime-local]{
  flex:1;padding:10px 12px;
  border:1px solid var(--border);border-radius:8px;
  font-size:13px;background:var(--bg);color:var(--text);outline:none;
  font-family:inherit;color-scheme:dark;
}
@media(prefers-color-scheme:light){.add-box input[type=datetime-local]{color-scheme:light}}
.add-box input[type=datetime-local]:focus{border-color:var(--accent)}
.add-box button{
  padding:10px 16px;border:none;border-radius:8px;
  background:var(--accent);color:var(--bg);
  font-size:13px;font-weight:600;cursor:pointer;
}
.add-box button:active{opacity:.8}
.add-box .edit-mode{
  font-size:11px;color:var(--accent);margin-bottom:8px;font-weight:500;
}

/* events */
.event{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px;margin-bottom:8px;
  transition:border-color .15s;
}
.event:hover{border-color:var(--text3)}
.event.past{opacity:.5}
.event .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.event .name{font-size:15px;font-weight:600;letter-spacing:-.01em}
.event .actions{display:flex;gap:6px}
.event .actions button{
  background:none;border:1px solid var(--border);color:var(--text3);
  font-size:11px;padding:3px 8px;border-radius:5px;cursor:pointer;
  opacity:0;transition:opacity .15s,color .15s,border-color .15s;
}
.event:hover .actions button{opacity:1}
.event .actions button:hover{color:var(--text);border-color:var(--text3)}
.event .actions button.del:hover{color:var(--danger);border-color:var(--danger)}

.event .timer{display:flex;gap:16px}
.event .timer .unit{text-align:center}
.event .timer .unit .val{
  font-size:22px;font-weight:700;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;
}
.event .timer .unit .lbl{font-size:10px;color:var(--text3);margin-top:2px;text-transform:uppercase;letter-spacing:.04em}
.event .timer .unit .val.green{color:var(--green)}

.event .date-str{font-size:12px;color:var(--text3);margin-top:10px}
.event .badge{
  display:inline-block;font-size:10px;font-weight:600;
  padding:2px 8px;border-radius:4px;
  background:var(--accent);color:var(--bg);
  margin-left:8px;vertical-align:middle;
}
.event .badge.today{background:var(--green)}

.empty{text-align:center;color:var(--text3);padding:48px 0;font-size:14px}

/* toast */
.toast{
  position:fixed;bottom:calc(env(safe-area-inset-bottom) + 24px);
  left:50%;transform:translateX(-50%) translateY(12px);
  background:var(--surface-2);border:1px solid var(--border);
  border-radius:8px;padding:10px 18px;
  font-size:13px;color:var(--text2);
  opacity:0;pointer-events:none;
  transition:opacity .2s var(--ease),transform .2s var(--ease);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>

<div class="wrap">

  <!-- AUTH -->
  <div id="v-auth" class="hidden">
    <div class="auth">
      <p class="logo">countdown</p>
      <h1 id="auth-title">Inicia sessio</h1>
      <p class="sub">Els teus esdeveniments, nomes per a tu</p>
      <p class="err" id="err"></p>
      <form id="f">
        <input type="text" id="u" placeholder="Usuari" autocomplete="off" required>
        <input type="password" id="p" placeholder="Contrasenya" required>
        <button type="submit" id="btn">Entrar</button>
      </form>
      <p class="swap"><span id="st">No tens compte?</span> <a id="sa">Registra't</a></p>
    </div>
  </div>

  <!-- MAIN -->
  <div id="v-main" class="hidden">
    <div class="hdr">
      <h1>countdown</h1>
      <div class="right">
        <span class="date" id="today-label"></span>
        <button class="out" onclick="doLogout()">sortir</button>
      </div>
    </div>

    <div class="add-box" id="add-box">
      <p class="edit-mode hidden" id="edit-label">editant</p>
      <input type="text" id="ev-name" placeholder="nom de l'esdeveniment" autocomplete="off">
      <div class="row">
        <input type="datetime-local" id="ev-date">
        <button id="add-btn" onclick="saveEvent()">afegir</button>
      </div>
    </div>

    <div id="events-list"></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
let currentUser = null;
let isReg = false;
let editId = null;
let events = [];

// crypto
async function hash(pw, salt){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw + salt));
  return btoa(String.fromCharCode(...new Uint8Array(buf)));
}
function rnd(){ return btoa(String.fromCharCode(...crypto.getRandomValues(new Uint8Array(16)))); }

// storage
function getUsers(){ return JSON.parse(localStorage.getItem('cd_users') || '{}'); }
function setUsers(u){ localStorage.setItem('cd_users', JSON.stringify(u)); }
function getEvents(user){ return JSON.parse(localStorage.getItem('cd_events_' + user) || '[]'); }
function setEvents(user, evs){ localStorage.setItem('cd_events_' + user, JSON.stringify(evs)); }

// views
function showView(id){
  document.getElementById('v-auth').classList.toggle('hidden', id !== 'v-auth');
  document.getElementById('v-main').classList.toggle('hidden', id !== 'v-main');
}

// auth
document.getElementById('sa').onclick = () => {
  isReg = !isReg;
  document.getElementById('auth-title').textContent = isReg ? "Crea un compte" : "Inicia sessio";
  document.getElementById('btn').textContent = isReg ? "Registra't" : "Entrar";
  document.getElementById('st').textContent = isReg ? 'Ja tens compte?' : 'No tens compte?';
  document.getElementById('sa').textContent = isReg ? 'Inicia sessio' : "Registra't";
  document.getElementById('err').textContent = '';
};

document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const u = document.getElementById('u').value.trim();
  const p = document.getElementById('p').value;
  if(!u || !p) return;
  const users = getUsers();
  try {
    if(isReg){
      if(users[u]) throw 'Aquest usuari ja existeix';
      if(p.length < 4) throw 'Contrasenya massa curta (min. 4)';
      const salt = rnd();
      users[u] = { h: await hash(p, salt), s: salt };
      setUsers(users);
      currentUser = u;
      events = getEvents(u);
      showView('v-main');
      render();
    } else {
      if(!users[u]) throw 'Usuari no trobat';
      const h = await hash(p, users[u].s);
      if(h !== users[u].h) throw 'Contrasenya incorrecta';
      currentUser = u;
      events = getEvents(u);
      showView('v-main');
      render();
    }
  } catch(err){ document.getElementById('err').textContent = err; }
};

function doLogout(){
  currentUser = null;
  events = [];
  editId = null;
  showView('v-auth');
}

// events
function saveEvent(){
  const name = document.getElementById('ev-name').value.trim();
  const date = document.getElementById('ev-date').value;
  if(!name || !date) return;
  const ts = new Date(date).getTime();

  if(editId){
    const idx = events.findIndex(e => e.id === editId);
    if(idx > -1) events[idx] = { ...events[idx], name, date: ts };
    cancelEdit();
  } else {
    events.push({ id: Date.now(), name, date: ts });
    events.sort((a,b) => a.date - b.date);
    document.getElementById('ev-name').value = '';
    document.getElementById('ev-date').value = '';
  }

  setEvents(currentUser, events);
  render();
  toast(editId ? 'Editat' : 'Afegit');
}

function editEvent(id){
  const ev = events.find(e => e.id === id);
  if(!ev) return;
  editId = id;
  document.getElementById('ev-name').value = ev.name;
  const d = new Date(ev.date);
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  document.getElementById('ev-date').value = d.toISOString().slice(0,16);
  document.getElementById('edit-label').classList.remove('hidden');
  document.getElementById('add-btn').textContent = 'desar';
  document.getElementById('ev-name').focus();
}

function cancelEdit(){
  editId = null;
  document.getElementById('ev-name').value = '';
  document.getElementById('ev-date').value = '';
  document.getElementById('edit-label').classList.add('hidden');
  document.getElementById('add-btn').textContent = 'afegir';
}

function delEvent(id){
  events = events.filter(e => e.id !== id);
  setEvents(currentUser, events);
  render();
  toast('Esborrat');
}

function getDiff(ts){
  const diff = ts - Date.now();
  if(diff <= 0) return null;
  const s = Math.floor(diff/1000);
  return { d: Math.floor(s/86400), h: Math.floor((s%86400)/3600), m: Math.floor((s%3600)/60), sec: s%60 };
}

function render(){
  document.getElementById('today-label').textContent = new Date().toLocaleDateString('ca',{weekday:'long', day:'numeric', month:'long'});

  const el = document.getElementById('events-list');
  if(!events.length){
    el.innerHTML = '<p class="empty">Cap esdeveniment. Afegeix-ne un per sobre.</p>';
    return;
  }

  el.innerHTML = '';
  for(const ev of events){
    const diff = getDiff(ev.date);
    const isPast = !diff;
    const isToday = new Date(ev.date).toDateString() === new Date().toDateString();

    const div = document.createElement('div');
    div.className = 'event' + (isPast ? ' past' : '');

    let timerHtml;
    if(isPast){
      timerHtml = '<div class="timer"><div class="unit"><div class="val">--</div><div class="lbl">passat</div></div></div>';
    } else {
      const units = [
        { val: diff.d, lbl: 'dies' },
        { val: diff.h, lbl: 'hores' },
        { val: diff.m, lbl: 'min' },
        { val: diff.sec, lbl: 'seg' }
      ];
      timerHtml = '<div class="timer">' + units.map(u =>
        `<div class="unit"><div class="val">${u.val}</div><div class="lbl">${u.lbl}</div></div>`
      ).join('') + '</div>';
    }

    const dateStr = new Date(ev.date).toLocaleDateString('ca',{weekday:'short', day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'});
    const badge = isToday ? '<span class="badge today">avui</span>' : (diff && diff.d === 0 ? '<span class="badge">avui</span>' : '');

    div.innerHTML = `
      <div class="top">
        <span class="name">${esc(ev.name)}${badge}</span>
        <div class="actions">
          <button onclick="editEvent(${ev.id})">editar</button>
          <button class="del" onclick="delEvent(${ev.id})">esborrar</button>
        </div>
      </div>
      ${timerHtml}
      <div class="date-str">${dateStr}</div>
    `;
    el.appendChild(div);
  }
}

function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

let toastTimer;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),1800);
}

document.getElementById('ev-name').onkeydown = e=>{ if(e.key==='Enter') document.getElementById('ev-date').focus(); };
document.getElementById('ev-date').onkeydown = e=>{ if(e.key==='Enter') saveEvent(); };

// init
showView('v-auth');
</script>
</body>
</html>
